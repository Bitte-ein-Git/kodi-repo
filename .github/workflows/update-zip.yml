name: Copy Fordy's Kodi Repo .zip🗿

on:
  workflow_dispatch:

jobs:
    update-zip:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          python-version: ["3.10"]
      steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Update pip
        run: python -m pip install --upgrade pip
      - name: Update Submodules
        run: |
          git submodule update --init --recursive --checkout --remote -f
          git config --global user.name "GitHub Action"
          git config --global user.email "noreply@github.com"
      - name: Copy latest zip to root
        run: |
          SOURCE_FILE=$(ls -t repo/zips/repository.heyfordy/*.zip | head -n 1)
          cp "$SOURCE_FILE" repository.heyfordy.zip
