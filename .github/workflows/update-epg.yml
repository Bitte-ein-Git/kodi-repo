name: "🧰 EPG .xml Updater"

on:
  schedule:
    - cron: "0 */4 * * *" # every 4h
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Generate EPG XML
        run: |
          python - <<'PY'
          import re
          import requests
          from lxml import etree
          import os
          from datetime import datetime, timedelta

          # channel mapping for m3u
          m3u_channels = {
              "Das Erste.de": "Das Erste FHD",
              "ZDF.de": "ZDF HD",
              "SR Fernsehen.de": "SR Fernsehen FHD",
              "ARTE.de": "ARTE HD",
              "ZDFneo.de": "ZDFneo HD",
              "tagesschau24.de": "Tagesschau24 HD",
              "ZDFinfo.de": "ZDFinfo HD",
              "Red Bull TV.de": "Red Bull TV FHD",
              "Red Bull TV.en": "Red Bull TV (English) FHD",
              "More Than Sports TV.de": "More Than Sports TV FHD",
              "WELT.de": "WELT FHD",
              "Welt der Wunder.de": "Welt der Wunder FHD",
              "SWR Fernsehen RP.de": "SWR Rheinland-Pfalz FHD",
              "RTLTeleLuxembourg.lu": "RTL Télé Lëtzebuerg",
              "RTL.Zwee.lu": "RTL Zwee"
          }

          # source id mapping (angepasst für Fallbacks als Liste)
          source_map = {
              "Das Erste.de": [("de", "Das Erste.de")],
              "ZDF.de": [("de", "ZDF.de")],
              "SR Fernsehen.de": [("de", "SR Fernsehen.de")],
              "ARTE.de": [("de", "ARTE.de")],
              "ZDFneo.de": [("de", "ZDFneo.de")],
              "tagesschau24.de": [("de", "tagesschau24.de")],
              "ZDFinfo.de": [("de", "ZDFinfo.de")],
              "Red Bull TV.de": [("de", "Red Bull TV.de")],
              "Red Bull TV.en": [("en", "10001")],
              "More Than Sports TV.de": [("de", "More Than Sports TV.de")],
              "WELT.de": [("de", "WELT.de")],
              "Welt der Wunder.de": [("de", "Welt der Wunder.de")],
              "SWR Fernsehen RP.de": [("de", "SWR Fernsehen RP.de")],
              "RTLTeleLuxembourg.lu": [("lu", "rtlletze1.lu"), ("lu_alt", "RTLLÃ«tzebuerg.lu")],
              "RTL.Zwee.lu": [("lu", "rtlletze2.lu"), ("lu_alt", "RTLZwee.lu")]
          }
          
          # source urls (neue LU Quelle hinzugefügt)
          urls = {
              "de": "https://www.open-epg.com/files/germany3.xml",
              "en": "https://nzxmltv.com/iptv/redbull.xml",
              "lu": "https://www.open-epg.com/files/luxembourg1.xml",
              "lu_alt": "https://iptv-epg.org/files/epg-lu.xml"
          }

          allowed_tags = {"title","sub-title","desc","icon","url","category","date","credits","director","actor","episode-num","rating"}

          # download xml content
          def fetch_xml(url):
              print(f"[fetch] {url}")
              r = requests.get(url, timeout=30)
              r.raise_for_status()
              return etree.fromstring(r.content)

          # adjust timestamp by hours
          def shift_time(timestr, hours):
              if not timestr: return timestr
              try:
                  ts = timestr.split(" ")[0]
                  dt = datetime.strptime(ts, "%Y%m%d%H%M%S")
                  dt += timedelta(hours=hours)
                  suffix = timestr[14:] if len(timestr) > 14 else ""
                  return dt.strftime("%Y%m%d%H%M%S") + suffix
              except:
                  return timestr

          # create channel tag
          def copy_channel_element(target_id, display_name, src_icon_url):
              ch = etree.Element("channel", id=target_id)
              dn = etree.SubElement(ch, "display-name")
              dn.text = display_name
              if src_icon_url:
                  ic = etree.SubElement(ch, "icon")
                  ic.set("src", src_icon_url)
              return ch

          # create programme tag with optional timeshift
          def copy_programme(src_prog, target_channel_id, shift_hours=0):
              prog = etree.Element("programme")
              for attr in ("start","stop","channel"):
                  val = src_prog.get(attr)
                  if val:
                      if attr == "channel":
                          prog.set("channel", target_channel_id)
                      elif attr in ("start", "stop") and shift_hours != 0:
                          prog.set(attr, shift_time(val, shift_hours))
                      else:
                          prog.set(attr, val)
              
              for child in src_prog:
                  tag = etree.QName(child).localname
                  if tag in allowed_tags:
                      prog.append(child)
              
              # --- FIX RED BULL DATE ---
              for child in prog:
                  if child.tag == "episode-num" and child.get("system") == "original-air-date":
                      if child.text:
                          try:
                              year = child.text.split("-")[0]
                              if len(year) == 4 and year.isdigit():
                                  d = prog.find("date")
                                  if d is None:
                                      d = etree.SubElement(prog, "date")
                                  d.text = year
                          except:
                              pass
                      break
              # -------------------------

              return prog

          trees = {}
          for k,url in urls.items():
              try:
                  trees[k] = fetch_xml(url)
              except Exception as e:
                  print(f"[warn] Fehler beim Laden {url}: {e}")
                  trees[k] = None

          tv = etree.Element("tv", attrib={"generator-info-name":"custom-merge-script-v5"})

          # extract channel icons
          source_icons = {}
          for key, tree in trees.items():
              if tree is None: continue
              for ch in tree.findall("channel"):
                  src_id = ch.get("id")
                  if src_id:
                      icon = ch.find("icon")
                      if icon is not None and icon.get("src"):
                          source_icons[(key, src_id)] = icon.get("src")

          # process mappings
          for final_id, nice_name in m3u_channels.items():
              sources = source_map.get(final_id, [])
              
              if not sources:
                  print(f"[missing] {final_id} nicht in source_map definiert.")
                  tv.append(copy_channel_element(final_id, nice_name, None))
                  continue

              # Hole das erste verfügbare Icon aus den gelisteten Quellen
              icon_url = None
              for src_key, src_id in sources:
                  icon = source_icons.get((src_key, src_id))
                  if icon:
                      icon_url = icon
                      break

              tv.append(copy_channel_element(final_id, nice_name, icon_url))
              
              seen_starts = set() # Speicher für Deduplizierung der Startzeiten

              for src_key, src_id in sources:
                  src_tree = trees.get(src_key)
                  if src_tree is None:
                      print(f"[warn] Source '{src_key}' für {final_id} nicht verfügbar.")
                      continue
                  
                  # set 1h shift for Luxembourg sources
                  time_shift = 1 if src_key in ("lu", "lu_alt") else 0
                  
                  added_count = 0
                  for prog in src_tree.findall("programme"):
                      if prog.get("channel") == src_id:
                          raw_start = prog.get("start")
                          shifted_start = shift_time(raw_start, time_shift) if time_shift != 0 else raw_start
                          
                          # Nur hinzufügen, wenn die Startzeit noch nicht belegt ist
                          if shifted_start not in seen_starts:
                              seen_starts.add(shifted_start)
                              new_prog = copy_programme(prog, final_id, time_shift)
                              tv.append(new_prog)
                              added_count += 1
                  
                  if added_count > 0:
                      print(f"[mapped] {final_id} <= {src_key}:{src_id} ({added_count} Sendungen)")

          # write output file
          tree_out = etree.ElementTree(tv)
          out_path = "iptv/guide.xml"
          os.makedirs(os.path.dirname(out_path), exist_ok=True)
          tree_out.write(out_path, encoding="utf-8", xml_declaration=True, pretty_print=True)
          print(f"[ok] geschrieben: {out_path}")
          PY

      - name: Commit and push updated EPG
        run: |
          git config user.name "EPG Updater Bot"
          git config user.email "bot@users.noreply.github.com"
          git add iptv/guide.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🧰 Update EPG guide.xml"
            git push
          fi