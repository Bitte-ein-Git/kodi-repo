name: "[📺 EPG] » Update MagentaTV"

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC (3:00 CET)
  workflow_dispatch:

jobs:
  update-magenta-epg:
    name: Update MagentaTV EPG XMLs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      # 1. Main - Magenta 2.0 API (+ extended meta & media)
      - name: 🔄 Run Magenta v2 Grabber (Main)
        run: |
          echo "📺 Updating MagentaTV 2.0 EPG..."
          python scripts/magenta_epg.py
          echo "✅ Main EPG updated!"

      # 2. Alternative / Lite - Magenta 1.0 API
      - name: 🔄 Run Magenta v1 Grabber (Lite)
        run: |
          echo "📺 Updating MagentaTV Lite EPG..."
          python scripts/magenta_lite.py
          echo "✅ Lite EPG updated!"

      - name: 📤 Commit & Push EPG XMLs
        run: |
          git config user.name "📺 EPG [🤖Bot]"
          git config user.email "epg-bot@heyfordy.dev"
          # Füge beide Dateien hinzu
          git add iptv/magenta.xml
          git add iptv/magenta_lite.xml
          git commit -m "📺 EPG » 🧰 MagentaTV updated!" || echo "No changes to commit"
          git commit -m "$(TZ='Europe/Berlin' date +"%d.%m.%Y %H:%M:%S %Z")" || echo "-"
          git push