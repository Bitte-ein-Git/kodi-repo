name: 📺 Magenta EPG .xml Updater

on:
  schedule:
    - cron: '0 3 * * *'  # Täglich um 03:00 Uhr UTC
  workflow_dispatch:     # Manuelles Auslösen erlaubt

jobs:
  update-magenta-epg:
    name: Update MagentaTV EPG XMLs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      # 1. Neues Skript (Magenta 2.0 API)
      - name: 🔄 Run Magenta v2 Grabber (Main)
        run: |
          echo "📺 Starte MagentaTV v2 (Main) Update..."
          python scripts/magenta_epg.py
          echo "✅ Main EPG erstellt."

      # 2. Altes Skript (Magenta 1.0 API / Lite)
      - name: 🔄 Run Magenta v1 Grabber (Lite)
        run: |
          echo "📺 Starte MagentaTV v1 (Lite) Update..."
          python scripts/magenta_lite.py
          echo "✅ Lite EPG erstellt."

      - name: 📤 Commit & Push EPG XMLs
        run: |
          git config user.name "Magenta EPG Bot"
          git config user.email "epg-bot@example.com"
          # Füge beide Dateien hinzu
          git add iptv/magenta.xml
          git add iptv/magenta_lite.xml
          git commit -m "🔄 Update MagentaTV EPGs $(date -u +"%Y-%m-%d %H:%M:%S UTC")" || echo "No changes to commit"
          git push